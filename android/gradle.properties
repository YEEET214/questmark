org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Never let Gradle download Android SDK components (CMake, NDK, platforms)
# on its own. If one is missing, the build fails with a message instead,
# so the developer decides whether to install it (see CLAUDE.md).
android.builder.sdkDownload=false
# Kotlin's incremental compiler fails ("Could not close incremental caches")
# when plugin sources (pub cache on C:) and this project (D:) are on
# different drives. Full Kotlin compiles are slightly slower but reliable.
kotlin.incremental=false
